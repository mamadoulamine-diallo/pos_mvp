name: Backend Microservices CI

on:
  push:
    branches:
      - v2-microservices
  pull_request:
    branches:
      - v2-microservices

jobs:
  test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - activity-service
          - api-gateway
          - config-server
          - product-service
          - sale-service
          - user-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: microservices/${{ matrix.service }}/pom.xml

      - name: Build and run tests
        working-directory: microservices/${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw clean verify